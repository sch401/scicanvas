[graph]
targets = ["x86_64-pc-windows-msvc"]
all-features = true

[advisories]
yanked = "deny"
unmaintained = "all"
unused-ignored-advisory = "deny"
# Maintenance notices only; no vulnerability/unsoundness advisory is ignored.
ignore = [
    { id = "RUSTSEC-2024-0436", reason = "paste 1.0.15 is required by accesskit_windows 0.23.2 for egui accessibility; revisit with eframe upgrade" },
    { id = "RUSTSEC-2026-0192", reason = "ttf-parser 0.25.1 is required by owned_ttf_parser 0.25.1 / ab_glyph; revisit during A6 font migration" },
    { id = "RUSTSEC-2026-0206", reason = "rustybuzz 0.20.1 is required by the resvg/usvg 0.45.1 and svg2pdf 0.13 shared text stack; no safe upgrade is currently available, revisit with the next coordinated renderer release" },
]

[licenses]
allow = ["MIT", "Apache-2.0", "BSD-2-Clause", "BSD-3-Clause", "ISC", "Zlib", "Unicode-3.0"]
confidence-threshold = 0.93
# Existing GUI/shared-font dependencies only. New packages still use the permissive allowlist.
exceptions = [
    { name = "clipboard-win", version = "=5.4.3", allow = ["BSL-1.0"] },
    { name = "error-code", version = "=3.4.0", allow = ["BSL-1.0"] },
    { name = "epaint_default_fonts", version = "=0.30.0", allow = ["OFL-1.1", "LicenseRef-UFL-1.0"] },
    # wgpu/naga 的十六进制解析依赖；随包提供上游声明与 CC0 完整原文，仅限此锁定版本。
    { name = "hexf-parse", version = "=0.2.1", allow = ["CC0-1.0"] },
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
