name: 检查
on:
  push:
    branches: [main]
    tags: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  check:
    name: Rust / Windows
    runs-on: windows-latest
    env:
      CARGO_INCREMENTAL: 0
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Rust 工具链
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          rustup default stable
      # 按编译器和依赖复用缓存，仅保存依赖产物，不打包本项目测试程序和解压后的 crate 源码。
      - name: Rust 依赖缓存
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: ". -> target"
          cache-bin: false
      - name: 依赖许可、安全与来源检查
        run: |
          python tools/install_cargo_deny.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & ./target/tools/cargo-deny/cargo-deny.exe --locked check --hide-inclusion-graph
      - name: 第三方声明与离线源码检查
        run: |
          cargo fetch --locked --target x86_64-pc-windows-msvc
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/third_party.py --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s tools -p "test_*.py"
      - name: 清单同步与子项显示回归
        run: |
          python tools/sync_docs.py --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s docs/parity -p "test_*.py"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --test docs/parity/parity.test.cjs
      - run: cargo fmt --all -- --check
      - run: cargo test --profile ci --workspace --all-features --locked
      - run: cargo test --profile ci -p scicanvas-core --no-default-features --locked
      - run: cargo clippy --profile ci --workspace --all-targets --all-features --locked -- -D warnings

      - name: 构建 Windows release
        run: cargo build --release --locked -p scicanvas
      - name: Windows release 首帧冒烟
        timeout-minutes: 1
        run: |
          $env:SCICANVAS_SMOKE_TEST = '1'
          $process = Start-Process ./target/release/scicanvas.exe -PassThru
          $null = $process.Handle
          if (-not $process.WaitForExit(50000)) {
            $process.Kill()
            throw 'SciCanvas 未在首帧后退出'
          }
          Get-Content "$env:LOCALAPPDATA/SciCanvas/recovery/crash.log" -ErrorAction SilentlyContinue
          if ($process.ExitCode -ne 0) { throw "SciCanvas 启动失败：$($process.ExitCode)" }
