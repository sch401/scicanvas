name: 检查
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  check:
    name: Rust / Windows
    runs-on: windows-latest
    env:
      CARGO_INCREMENTAL: 0
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Rust 工具链
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          rustup default stable
      - name: 恢复依赖与测试构建缓存
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/ci
          key: ${{ runner.os }}-ci-${{ hashFiles('Cargo.lock', 'Cargo.toml') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-ci-${{ hashFiles('Cargo.lock', 'Cargo.toml') }}-
      - run: cargo fmt --all -- --check
      - run: cargo test --profile ci --workspace --all-features --locked
      - run: cargo test --profile ci -p scicanvas-core --no-default-features --locked
      - run: cargo clippy --profile ci --workspace --all-targets --all-features --locked -- -D warnings
