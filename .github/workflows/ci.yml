name: 检查
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  check:
    name: Rust / Windows
    runs-on: windows-latest
    env:
      CARGO_INCREMENTAL: 0
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Rust 工具链
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          rustup default stable
      - name: 恢复依赖与测试构建缓存
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/ci
          key: ${{ runner.os }}-ci-${{ hashFiles('Cargo.lock', 'Cargo.toml') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-ci-${{ hashFiles('Cargo.lock', 'Cargo.toml') }}-
      - name: 依赖许可、安全与来源检查
        run: |
          python tools/install_cargo_deny.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & ./target/tools/cargo-deny/cargo-deny.exe --locked check --hide-inclusion-graph
      - name: 清单同步与子项显示回归
        run: |
          python docs/parity/build_parity.py --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s docs/parity -p "test_*.py"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --test docs/parity/parity.test.cjs
      - run: cargo fmt --all -- --check
      - run: cargo test --profile ci --workspace --all-features --locked
      - run: cargo test --profile ci -p scicanvas-core --no-default-features --locked
      - run: cargo clippy --profile ci --workspace --all-targets --all-features --locked -- -D warnings
      - name: 保存构建缓存
        uses: actions/cache/save@v6
        timeout-minutes: 2
        continue-on-error: true
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/ci
          key: ${{ runner.os }}-ci-${{ hashFiles('Cargo.lock', 'Cargo.toml') }}-${{ github.sha }}
