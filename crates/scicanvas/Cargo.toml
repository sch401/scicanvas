[package]
name = "scicanvas"
description = "SciCanvas：仿 Origin 界面的开源科研绘图软件（原型）"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "scicanvas"
path = "src/main.rs"

[dependencies]
tiff = { version = "=0.11.3", default-features = false, features = ["lzw"] }
scicanvas-core = { version = "0.1.0", path = "../scicanvas-core", features = ["serde", "encoding", "xlsx"] }
# 界面：eframe/egui 及其表格、SVG 图标组件，版本必须一致
eframe = "0.29"
egui_extras = { version = "0.29", default-features = false }
# 系统原生的打开/保存文件对话框
rfd = "0.15"
# PNG、PDF 与图标共用同代渲染栈，文字使用统一字体库
resvg = { version = "=0.45.1", default-features = false, features = ["text", "system-fonts"] }
# 剪贴板位图（egui 已经依赖同一版本；image-data 用依赖树里已有的 image 0.25）
arboard = { version = "3.6", default-features = false, features = ["image-data"] }
# PNG pHYs 块的 CRC（已在依赖树里）
crc32fast = "1.4"
# PDF keeps the shared SVG as vectors and embeds text/font subsets; no image/filter features are needed.
svg2pdf = { version = "=0.13.0", default-features = false, features = ["text"] }

# Windows 使用带原生呈现队列的 wgpu，避免 OpenGL 驱动忽略窗口化垂直同步。
[target.'cfg(windows)'.build-dependencies]
winresource = { version = "=0.1.34", default-features = false }

[target.'cfg(windows)'.dependencies]
eframe = { version = "0.29", features = ["wgpu"] }
# eframe 关闭了 wgpu 的默认功能；显式编译 main 选择的 DX12 后端。
wgpu = { version = "22.1", default-features = false, features = ["dx12"] }
